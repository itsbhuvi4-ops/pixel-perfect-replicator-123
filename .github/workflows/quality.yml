name: BIDXAUCTION Quality Gate

on:
  push:
    branches: ["main", "convex-migration-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - run: bun install --no-save
      - run: CONVEX_AGENT_MODE=anonymous bunx convex dev --once\n      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run build
